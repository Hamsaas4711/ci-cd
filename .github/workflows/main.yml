name: CI-CD 

on:
 push:
  branches: [main]
 workflow_dispatch:

jobs:
 build:
  runs-on: ubuntu-latest
  steps:
  - name: Checkout code
    uses: actions/checkout@v4


  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: '18'   

  - name: Install dependencies
    run: npm install || echo "No dependecies installed"

  - name: Deploy application
    run: echo "deploying application"

 test:
  runs-on: ubuntu-latest
  needs: build 
  steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Test application
      run: npm test

 deploy:
  runs-on: ubuntu-latest
  needs: test
  steps:
   - name: Checkout code
     uses: actions/checkout@v4

   - name: Deploying the website
     run: echo "Deploying the applications"
